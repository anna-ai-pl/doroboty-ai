name: Deployment smoke
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS deployment URL
        required: true
        type: string
      analytics:
        description: Verify configured PostHog homepage events
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: npx playwright test --config playwright.deployment.config.ts
        env:
          Q42_URL: ${{ inputs.url }}
          Q43_ANALYTICS: ${{ inputs.analytics && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q42-public-flow
          path: |
            artifacts/q42-*.png
            artifacts/q43-*.png
            test-results/
